name: masa-arkadasi

services:
  companion-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: masa-arkadasi-api:local
    restart: unless-stopped
    init: true
    env_file:
      - /etc/masa-arkadasi/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      MEMORY_DB_PATH: /app/data/memories.sqlite
    expose:
      - "3000"
    volumes:
      - companion_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2.11.9-alpine
    user: "10001:10001"
    restart: unless-stopped
    init: true
    depends_on:
      companion-api:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - /etc/masa-arkadasi/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

volumes:
  companion_data:
  caddy_data:
  caddy_config:
